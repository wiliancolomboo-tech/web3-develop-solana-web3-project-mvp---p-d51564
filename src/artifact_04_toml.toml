[package]
name = "univibe"
version = "0.1.0"
description = "Autonomous Campus Bounty & Micro-Grant Protocol for KUBG UNI Vibeathon"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "univibe"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"