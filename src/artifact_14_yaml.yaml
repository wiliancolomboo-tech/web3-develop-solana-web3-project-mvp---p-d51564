version: "3.8"

services:
  vibevault-indexer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibevault-daemon
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com
      - PROGRAM_ID=V1beVau1tKUbgUniVibeathon111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL_TARGET=vibethon-leads@korea.ac.kr
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"