version: '3.8'

services:
  univibe-event-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: univibe-event-relay
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_WS=wss://api.devnet.solana.com
      - PROGRAM_ID=V1beM1croGrant11111111111111111111111111111
      - RESEND_API_KEY=${RESEND_API_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ADMIN_AUDIT_EMAIL=chair@kubg.or.kr
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - univibe-net

networks:
  univibe-net:
    driver: bridge