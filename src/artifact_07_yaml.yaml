version: '3.8'

services:
  univibe-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: univibe_daemon_production
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - WALLET_PATH=/secrets/keypair.json
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY="mock_development_token_00000000000000"
      - CAMPUS_ADMIN_EMAIL=kubg_grants@korea.ac.kr
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"