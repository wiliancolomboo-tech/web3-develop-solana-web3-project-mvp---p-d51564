version: '3.8'

services:
  vibestream-oracle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibestream-oracle-service
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=VibeStr11111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_123456789_abcdef
      - ALERT_EMAIL=grants@kubg-vibeathon.edu
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3