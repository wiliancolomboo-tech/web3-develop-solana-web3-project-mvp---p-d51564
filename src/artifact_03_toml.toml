[package]
name = "univibe-engine"
version = "0.1.0"
description = "UniVibe Campus Micro-Bounty & Milestone Escrow Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "univibe_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }